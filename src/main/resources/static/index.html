<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contract Redlining Tool</title>
<style>
  :root {
    --red: #c62828; --ink: #1f2430; --muted: #7a8290; --line: #e7e9ee;
    --bg: #f6f7f9; --card: #fff; --accent: #1d4ed8; --accent-weak: #e6ecfd; --blue: #1d4ed8;
    --radius: 12px; --shadow: 0 1px 2px rgba(20,25,40,.06), 0 4px 16px rgba(20,25,40,.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 24px; padding: 0 24px; height: 58px;
           background: var(--red); border-bottom: 1px solid #a81f1f; position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; letter-spacing: -.01em; color: #fff; }
  .brand .dot { color: #ffc9c9; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: rgba(255,255,255,.82);
               font: inherit; cursor: pointer; }
  nav button:hover { background: rgba(255,255,255,.16); color: #fff; }
  nav button.active { background: #fff; color: var(--red); font-weight: 600; }
  main { padding: 28px 24px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  button.btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card);
               border-radius: 9px; padding: 9px 14px; color: var(--ink); }
  button.btn:hover { border-color: #cfd3dc; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover { background: #1e40af; }
  button.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
  button.btn:disabled { opacity: .5; cursor: default; }
  input, textarea { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line);
                    border-radius: 9px; background: var(--card); color: var(--ink); }
  input:focus, textarea:focus, #editor:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .view[hidden] { display: none; }

  /* cards grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .06s ease; }
  .card:hover { transform: translateY(-1px); border-color: #d7dbe4; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card .snippet { color: var(--muted); font-size: 13px; max-height: 42px; overflow: hidden; }
  mark.hl { background: #cfe0ff; color: #123c7a; border-radius: 3px; padding: 0 1px; }
  .empty { color: var(--muted); background: var(--card); border: 1px dashed var(--line);
           border-radius: var(--radius); padding: 40px; text-align: center; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }

  /* editor */
  .editor-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .editor-head h1 { margin: 0; }
  .editor-head .v { color: var(--muted); font-size: 13px; }
  .editor-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
  #editor { min-height: 340px; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius);
            background: var(--card); white-space: pre-wrap; outline: none; font-size: 16px; box-shadow: var(--shadow); }
  #editor:empty::before { content: "Type to redline. New text appears blue; removed text is struck through."; color: #b3b8c2; }
  .inserted { color: var(--blue); }
  .deleted  { color: var(--red); text-decoration: line-through; }
  .preview { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; }
  .side .allrow { display: flex; gap: 8px; margin-bottom: 12px; }
  .change { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--card); }
  .change .body { font-size: 14px; margin-bottom: 10px; word-break: break-word; }
  .change .old { color: var(--red); text-decoration: line-through; }
  .change .new { color: var(--blue); }
  .change .actions { display: flex; gap: 6px; }
  .change .actions .btn { padding: 5px 10px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="brand">Red<span class="dot">•</span>line</div>
  <nav>
    <button data-nav="library" class="active">Library</button>
    <button data-nav="new">New document</button>
  </nav>
</header>

<main>
  <!-- LIBRARY -->
  <section id="view-library" class="view">
    <div class="wrap">
      <div class="toolbar">
        <div><h1>Your documents</h1><p class="sub">Open one to redline it.</p></div>
        <button class="btn primary" data-nav="new">+ New document</button>
      </div>
      <input id="search-input" placeholder="Search documents…" style="margin-bottom:18px" />
      <div id="doc-grid" class="grid"></div>
    </div>
  </section>

  <!-- NEW -->
  <section id="view-new" class="view" hidden>
    <div class="wrap" style="max-width:640px">
      <h1>New document</h1>
      <p class="sub">Give it a title and paste the text you want to redline.</p>
      <label>Title</label>
      <input id="new-title" placeholder="e.g. Master Services Agreement" />
      <label>Text</label>
      <textarea id="new-text" rows="12" placeholder="Paste document text here…"></textarea>
      <div style="margin-top:18px; display:flex; gap:8px;">
        <button class="btn primary" id="new-create">Save</button>
        <button class="btn ghost" data-nav="library">Cancel</button>
      </div>
    </div>
  </section>

  <!-- EDITOR -->
  <section id="view-editor" class="view" hidden>
    <div class="wrap" style="max-width:1100px">
      <div class="editor-head">
        <button class="btn ghost" data-nav="library">← Library</button>
        <h1 id="editor-title">Document</h1>
        <span class="v" id="editor-version"></span>
      </div>
      <div class="editor-grid">
        <div>
          <div id="editor" contenteditable="true" spellcheck="false"></div>
          <div class="preview" id="accepted-preview"></div>
        </div>
        <div class="side">
          <h2>Pending changes</h2>
          <div class="allrow">
            <button class="btn" id="accept-all">Accept all</button>
            <button class="btn" id="reject-all">Reject all</button>
          </div>
          <div id="change-list"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<script>
"use strict";

// pending: keystroke changes applied locally but not yet saved to the server.
const state = { docId: null, version: 0, segments: [], docs: [], pending: [] };
let saveChain = Promise.resolve();
let flushTimer = null;
const FLUSH_DELAY_MS = 400;   // debounce: coalesce a burst of typing into one save
const FLUSH_MAX_PENDING = 250; // ...but don't let the batch grow unbounded

// ---- API -----------------------------------------------------------------
async function api(method, path, body, ifMatch) {
  const headers = {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (ifMatch != null) headers["If-Match"] = '"' + ifMatch + '"';
  const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data && data.error) || (method + " " + path + " failed"));
  return data;
}
const listDocs    = () => api("GET", "/documents");
const createDoc   = (text, title) => api("POST", "/documents", { text, title });
const getDoc      = (id) => api("GET", "/documents/" + id);
const editStream  = (id, changes, v) => api("POST", "/documents/" + id + "/edits", { changes }, v);
const acceptRange = (id, start, end, v) => api("POST", "/documents/" + id + "/accept", { start, end }, v);
const rejectRange = (id, start, end, v) => api("POST", "/documents/" + id + "/reject", { start, end }, v);
const acceptAll   = (id, v) => api("POST", "/documents/" + id + "/accept-all", undefined, v);
const rejectAll   = (id, v) => api("POST", "/documents/" + id + "/reject-all", undefined, v);
const searchDocs  = (q) => api("GET", "/documents/search?q=" + encodeURIComponent(q));

// ---- helpers -------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const flatText = () => state.segments.map(s => s.text).join("");
const acceptedTextLocal = () => state.segments.filter(s => s.type !== "DELETED").map(s => s.text).join("");
function escapeHtml(s) {
  return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// ---- routing -------------------------------------------------------------
function showView(name) {
  document.querySelectorAll(".view").forEach(v => v.hidden = true);
  $("view-" + name).hidden = false;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.nav === name));
  if (name === "library") renderLibrary();
}
document.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => showView(b.dataset.nav)));

// ---- library + search ----------------------------------------------------
// One card for both the library listing and search results; pass query tokens to
// highlight matches (empty tokens -> plain text).
function card(id, title, text, tokens) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `<h3>${highlight(title || "(untitled)", tokens)}</h3>
                  <div class="snippet">${highlight(text || "", tokens) || "<em>empty</em>"}</div>`;
  el.onclick = () => openDoc(id);
  return el;
}
async function loadDocs() { state.docs = await listDocs(); }
async function renderLibrary() {
  try { await loadDocs(); } catch (e) { /* ignore */ }
  runSearch();
}
let searchTimer = null;
function onSearchInput() { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 200); }
async function runSearch() {
  const q = $("search-input").value.trim();
  const grid = $("doc-grid");
  if (!q) {                                   // empty query: show the whole library
    grid.innerHTML = "";
    if (state.docs.length === 0) { grid.innerHTML = '<div class="empty">No documents yet. Create one to get started.</div>'; return; }
    state.docs.forEach(d => grid.appendChild(card(d.id, d.title, d.preview, [])));
    return;
  }
  let results;
  try { results = (await searchDocs(q)).results; }
  catch (e) { grid.innerHTML = '<div class="empty">Search failed.</div>'; return; }
  const tokens = (q.toLowerCase().match(/\w+/g)) || [];
  grid.innerHTML = "";
  if (results.length === 0) { grid.innerHTML = '<div class="empty">No documents match your search.</div>'; return; }
  results.forEach(r => grid.appendChild(card(r.docId, r.title, r.snippet, tokens)));
}
$("search-input").addEventListener("input", onSearchInput);

function highlight(text, tokens) {
  let html = escapeHtml(text);
  if (tokens.length) {
    const re = new RegExp("(" + tokens.map(escapeRegex).join("|") + ")", "gi");
    html = html.replace(re, '<mark class="hl">$1</mark>');
  }
  return html;
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// ---- open / create -------------------------------------------------------
function applyDoc(doc) {
  // Authoritative reset: adopt the server's document and drop any local pending edits.
  clearTimeout(flushTimer); flushTimer = null; state.pending = [];
  state.docId = doc.id; state.version = doc.version; state.segments = doc.segments || [];
  $("editor-title").textContent = doc.title || "(untitled)";
  renderEditor();
}
async function openDoc(id) {
  try { applyDoc(await getDoc(id)); showView("editor"); $("editor").focus(); }
  catch (e) { alert(e.message); }
}
$("new-create").onclick = async () => {
  try {
    const title = $("new-title").value.trim();
    const doc = await createDoc($("new-text").value, title || null);
    $("new-title").value = ""; $("new-text").value = "";
    applyDoc(doc); showView("editor"); $("editor").focus();
  } catch (e) { alert(e.message); }
};

// ---- editor rendering ----------------------------------------------------
const editor = $("editor");
function renderEditor() {
  editor.innerHTML = state.segments.map(s => {
    const cls = s.type === "INSERTED" ? "inserted" : s.type === "DELETED" ? "deleted" : "";
    return `<span class="${cls}">${escapeHtml(s.text)}</span>`;
  }).join("");
  $("editor-version").textContent = "v" + state.version + (state.pending.length ? " • saving…" : "");
  $("accepted-preview").textContent = "If accepted: " + acceptedTextLocal();
  renderChanges();
}
// Groups consecutive non-UNCHANGED segments into one accept/reject unit. Note:
// adjacent redlines merge into a single "change" (an insertion touching a deletion
// becomes one) because there are no per-change IDs yet — see the README.
function changeGroups() {
  const groups = []; let offset = 0, cur = null;
  for (const seg of state.segments) {
    if (seg.type !== "UNCHANGED") {
      if (!cur) cur = { start: offset, end: offset, oldText: "", newText: "" };
      cur.end = offset + seg.text.length;
      if (seg.type === "DELETED") cur.oldText += seg.text; else cur.newText += seg.text;
    } else if (cur) { groups.push(cur); cur = null; }
    offset += seg.text.length;
  }
  if (cur) groups.push(cur);
  return groups;
}
function renderChanges() {
  const wrap = $("change-list"); const groups = changeGroups(); wrap.innerHTML = "";
  if (groups.length === 0) { wrap.innerHTML = '<div class="preview">No pending changes.</div>'; return; }
  groups.forEach((g, i) => {
    const el = document.createElement("div"); el.className = "change";
    const oldPart = g.oldText ? `<span class="old">${escapeHtml(g.oldText)}</span> ` : "";
    const newPart = g.newText ? `<span class="new">${escapeHtml(g.newText)}</span>` : '<span class="preview">(deletion)</span>';
    el.innerHTML = `<div class="body">${i + 1}. ${oldPart}${newPart}</div>
      <div class="actions"><button class="btn primary" data-a="accept">Accept</button>
      <button class="btn" data-a="reject">Reject</button></div>`;
    el.querySelector('[data-a=accept]').onclick = () => runOp(() => acceptRange(state.docId, g.start, g.end, state.version));
    el.querySelector('[data-a=reject]').onclick = () => runOp(() => rejectRange(state.docId, g.start, g.end, state.version));
    wrap.appendChild(el);
  });
}

// ---- caret in flattened coordinates --------------------------------------
function flattenedOffsetOf(container, offset) {
  const r = document.createRange();
  r.selectNodeContents(editor);
  r.setEnd(container, offset);
  return r.toString().length;
}
function caretOffsets() {
  const sel = window.getSelection();
  if (!sel.rangeCount) { const n = flatText().length; return { start: n, end: n }; }
  const range = sel.getRangeAt(0);
  const start = flattenedOffsetOf(range.startContainer, range.startOffset);
  return { start, end: start + range.toString().length };
}
function setCaret(offset) {
  const clamped = Math.max(0, Math.min(offset, editor.textContent.length));
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  let remaining = clamped, node;
  while ((node = walker.nextNode())) {
    if (remaining <= node.length) {
      const range = document.createRange(); range.setStart(node, remaining); range.collapse(true);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); return;
    }
    remaining -= node.length;
  }
  editor.focus();
}

// ---- optimistic editing --------------------------------------------------
// A client-side mirror of ONE range-replace from the server's ChangeEngine, so a
// keystroke renders instantly (correctly coloured) without waiting for the server.
// It must match the Java engine's single-change behaviour; the server stays
// authoritative and re-syncs us on each flush. Out-of-range is clamped (the caret
// can't produce it) rather than thrown — the server does the real validation.
function applyChangeLocal(segments, start, end, replacement) {
  const offs = [0];
  for (const s of segments) offs.push(offs[offs.length - 1] + s.text.length);
  const total = offs[offs.length - 1];
  start = Math.max(0, Math.min(start, total));
  end = Math.max(start, Math.min(end, total));
  const emit = (from, to, retype) => {
    const out = [];
    if (from >= to) return out;
    let pos = from, i = 0;
    while (i < segments.length && offs[i + 1] <= from) i++;
    while (pos < to && i < segments.length) {
      const segStart = offs[i], segEnd = offs[i + 1];
      const pieceStart = Math.max(pos, segStart), pieceEnd = Math.min(to, segEnd);
      if (pieceEnd > pieceStart) {
        const newType = retype(segments[i].type);
        if (newType !== null) out.push({ text: segments[i].text.slice(pieceStart - segStart, pieceEnd - segStart), type: newType });
      }
      pos = pieceEnd; i++;
    }
    return out;
  };
  const ident = t => t;
  const strike = t => t === "INSERTED" ? null : "DELETED";  // deleting your own insertion drops it
  let res = emit(0, start, ident).concat(emit(start, end, strike));
  if (replacement) res.push({ text: replacement, type: "INSERTED" });
  res = res.concat(emit(end, total, ident));
  const out = [];  // coalesce adjacent same-type runs
  for (const s of res) {
    if (out.length && out[out.length - 1].type === s.type) out[out.length - 1] = { text: out[out.length - 1].text + s.text, type: s.type };
    else out.push(s);
  }
  return out;
}

// Apply a change locally and render it now; queue it for a debounced save.
function optimisticEdit(change, caret) {
  state.segments = applyChangeLocal(state.segments, change.range.start, change.range.end, change.replacement);
  state.pending.push(change);
  renderEditor();
  setCaret(caret);
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, FLUSH_DELAY_MS);
  if (state.pending.length >= FLUSH_MAX_PENDING) flush();
}

// Send the queued keystrokes to the server as one ordered stream. Serialised on
// saveChain so flushes never overlap. On success we adopt the server version and,
// if the user has paused (nothing new queued), re-sync from its segments as a
// self-heal. On conflict/error we reload the authoritative document.
function flush() {
  clearTimeout(flushTimer); flushTimer = null;
  if (!state.docId || state.pending.length === 0) return saveChain;
  saveChain = saveChain.then(async () => {
    if (state.pending.length === 0) return;
    const docId = state.docId, baseVersion = state.version, sending = state.pending;
    state.pending = [];
    try {
      const doc = await editStream(docId, sending, baseVersion);
      if (state.docId !== docId) return;              // user navigated away mid-flight
      state.version = doc.version;
      if (state.pending.length === 0) {               // paused: safe to re-render from server
        const focused = document.activeElement === editor;
        const caret = focused ? caretOffsets().start : 0;
        state.segments = doc.segments || [];
        renderEditor();
        if (focused) setCaret(caret);
      } else {
        renderEditor();                                // still typing: just refresh the version label
      }
    } catch (err) {
      alert(err.message);
      if (state.docId === docId) { try { applyDoc(await getDoc(docId)); } catch (_) { /* ignore */ } }
    }
  });
  return saveChain;
}

// ---- live editing: every keystroke -> an optimistic local edit -----------
editor.addEventListener("beforeinput", (e) => {
  if (!state.docId) return;
  // IME composition is handled natively and reconciled on compositionend; don't
  // intercept it here (preventing default mid-composition breaks IME input).
  if (e.isComposing || e.inputType === "insertCompositionText") return;
  const { start, end } = caretOffsets();
  let range = null, replacement = "", caret = start;
  switch (e.inputType) {
    case "insertText": replacement = e.data || ""; range = [start, end]; caret = start + replacement.length; break;
    case "insertParagraph":
    case "insertLineBreak": replacement = "\n"; range = [start, end]; caret = start + 1; break;
    case "insertFromPaste":
      replacement = (e.dataTransfer && e.dataTransfer.getData("text")) || ""; range = [start, end]; caret = start + replacement.length; break;
    case "insertReplacementText": {   // autocorrect / spellcheck replacing a word
      const targets = e.getTargetRanges ? e.getTargetRanges() : [];
      if (targets.length) {
        const tr = targets[0];
        const s = flattenedOffsetOf(tr.startContainer, tr.startOffset);
        const en = flattenedOffsetOf(tr.endContainer, tr.endOffset);
        replacement = e.data || (e.dataTransfer && e.dataTransfer.getData("text")) || "";
        range = [s, en]; caret = s + replacement.length;
      }
      break;
    }
    case "deleteContentBackward":
      if (start !== end) { range = [start, end]; caret = start; }
      else if (start > 0) { range = [start - 1, start]; caret = start - 1; } break;
    case "deleteContentForward":
      if (start !== end) { range = [start, end]; caret = start; }
      else if (start < flatText().length) { range = [start, start + 1]; caret = start; } break;
    default: break;
  }
  e.preventDefault();
  if (!range) return;
  optimisticEdit({ range: { start: range[0], end: range[1] }, replacement }, caret);
});

// IME: let the browser compose natively, then apply the finished text as one
// optimistic insert at the position composition began.
let compositionStart = null;
editor.addEventListener("compositionstart", () => { compositionStart = caretOffsets().start; });
editor.addEventListener("compositionend", (e) => {
  const at = compositionStart != null ? compositionStart : caretOffsets().start;
  const data = e.data || "";
  compositionStart = null;
  if (!data || !state.docId) return;
  optimisticEdit({ range: { start: at, end: at }, replacement: data }, at + data.length);
});

async function runOp(fn) {
  // Push pending keystrokes first: accept/reject ranges are in the current
  // (optimistic) coordinate space, so the server must have those edits already.
  await flush();
  saveChain = saveChain.then(async () => {
    try { applyDoc(await fn()); }
    catch (e) { alert(e.message); if (state.docId) applyDoc(await getDoc(state.docId)); }
  });
  return saveChain;
}
$("accept-all").onclick = () => state.docId && runOp(() => acceptAll(state.docId, state.version));
$("reject-all").onclick = () => state.docId && runOp(() => rejectAll(state.docId, state.version));

// Save any pending keystrokes when focus leaves the editor (e.g. clicking a
// button, switching views) so nothing typed is lost.
editor.addEventListener("blur", () => flush());

// ---- boot ----------------------------------------------------------------
showView("library");
</script>
</body>
</html>
